trail: `<rect width="1200" height="900" fill="#cfe8f7"/><path d="M0 420 L260 180 L460 380 L680 140 L960 400 L1200 240 L1200 900 L0 900Z" fill="#9fb8cc"/>

${trees()}<circle cx="1040" cy="130" r="70" fill="#ffe27a"/>`,

function stars(n){let s='';for(let i=0;i<n;i++){s+=`<circle cx="${(i*197)%1200}" cy="${(i*89)%420}" r="${1+(i%3)}" fill="#fff" opacity="${.4+(i%5)/10}"/>`}return s}
function trees(){let s='';[[80,520],[200,560],[330,500],[880,520],[1000,560],[1120,510]].forEach(([x,y])=>{s+=`<path d="M${x-70} ${y+140} L${x} ${y-120} L${x+70} ${y+140}Z" fill="#245c34"/><rect x="${x-10}" y="${y+140}" width="20" height="40" fill="#5a3a22"/>`});return s}
function car(x,y,c){return `<g transform="translate(${x} ${y})"><path d="M-80 0 L-60 -40 L40 -50 L90 -10 L90 10 L-80 10Z" fill="${c}"/><circle cx="-50" cy="14" r="18" fill="#222"/><circle cx="60" cy="14" r="18" fill="#222"/><text x="0" y="-12" text-anchor="middle" font-family="Arial Black,Arial" font-size="26" fill="#fff">6</text></g>`}
window.draw = k => { document.getElementById('s').innerHTML = S[k]; };
